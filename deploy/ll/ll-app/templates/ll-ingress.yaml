{{- $liveOps := index .Values "ll-liveops" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ll-ingress
  namespace: ll
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.environmentHost }}
      http:
        paths:
          - path: /hub
            pathType: Prefix
            backend:
              service:
                name: ll-app-ll-backend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ll-app-ll-backend
                port:
                  number: 80
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: ll-app-ll-chat
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ll-app-ll-frontend
                port:
                  number: 80
    {{- if $liveOps.enabled }}
    - host: {{ required "liveOpsHost is required when ll-liveops is enabled" .Values.liveOpsHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ll-app-ll-liveops
                port:
                  number: 80
    {{- end }}
