apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ll
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi # resize later if needed
  storageClassName: "" # default StorageClass

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/postgres  # Make sure this directory exists on your node(s)
  persistentVolumeReclaimPolicy: Retain

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: ll
data:
  10-create-extra-dbs.sh: |
    #!/bin/bash
    set -e
    echo "Creating extra databases and roles …"

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE DATABASE lldb_chat;
      CREATE USER chatuser WITH ENCRYPTED PASSWORD 'Ch@tP@ss!';
      GRANT ALL PRIVILEGES ON DATABASE lldb_chat TO chatuser;
    EOSQL

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-chat-connection
  namespace: ll
type: Opaque
stringData:
  connectionString: |
    Host=postgres;Port=5432;
    Username=chatuser;Password=Ch@tP@ss!;
    Database=lldb_chat
---

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ll
type: Opaque
stringData:
  POSTGRES_USER: devuser
  POSTGRES_PASSWORD: S3cr3tP4ss!
  POSTGRES_DB: legendslegacy

---

apiVersion: v1
kind: Secret
metadata:
  name: postgres-ll-connection
  namespace: ll
type: Opaque
stringData:
  connectionString: "Host=postgres;Port=5432;Username=devuser;Password=S3cr3tP4ss!;Database=legendslegacy"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ll
spec:
  selector:
    matchLabels:
      app: postgres
  replicas: 1 # bump for read-only scale-out (+replication)
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent

          # Environment comes straight from the Secret
          envFrom:
            - secretRef:
                name: postgres-credentials

          ports:
            - containerPort: 5432
              name: postgres

          # Basic health checks
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "devuser"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "devuser"]
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb-scripts
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: initdb-scripts
          configMap:
            name: postgres-initdb
            defaultMode: 0755 

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ll
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP