apiVersion: v1
kind: Secret
metadata:
  name: postgres-ll-connection
  namespace: ll
type: Opaque
stringData:
  connectionString: "Host=postgres-ll;Port=5432;Database=legends_legacy;Username=ll_user;Password=sup3rSecr3t;Pooling=true;Ssl Mode=Disable"

---

apiVersion: v1
kind: Service
metadata:
  name: postgres-ll
  namespace: ll
labels:
  app: postgres-ll
spec:
  clusterIP: None
  ports:
  - port: 5432
    name: postgres
  selector:
    app: postgres-ll

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-ll
  namespace: ll
spec:
  serviceName: postgres-ll
  replicas: 1
  selector:
    matchLabels:
      app: postgres-ll
  template:
    metadata:
      labels:
        app: postgres-ll
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: legends_legacy
        - name: POSTGRES_USER
          value: ll_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-ll-connection
              key: connectionString         # parsed by bash below
        - name: PGDATA                      # store data in a sub-dir so init scripts persist
          value: /var/lib/postgresql/data/pgdata
        # Extract password from the full conn-string (first run only)
        # NB you could instead store plain POSTGRES_PASSWORD in the Secret.
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh","-c","export PGPASS=$(echo $POSTGRES_PASSWORD | sed -E 's/.*Password=([^;]*).*/\\1/'); sed -i \"s/^\(POSTGRES_PASSWORD=\).*/\\1$PGPASS/\" /docker-entrypoint.sh"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: gp2             # or whatever class your cluster offers
      resources:
        requests:
          storage: 8Gi
