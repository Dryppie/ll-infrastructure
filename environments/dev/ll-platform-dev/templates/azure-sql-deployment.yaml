apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-sql-edge
  namespace: mssql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-sql-edge
  template:
    metadata:
      labels:
        app: azure-sql-edge
    spec:
      containers:
      - name: azure-sql-edge
        image: mcr.microsoft.com/azure-sql-edge:latest
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mssql-secret
              key: password
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql
      volumes:
      - name: mssql-data
        persistentVolumeClaim:
          claimName: mssql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mssql-service
  namespace: mssql
spec:
  type: NodePort
  ports:
  - port: 1433
    targetPort: 1433
    nodePort: 30000 # Choose a NodePort between 30000-32767
  selector:
    app: azure-sql-edge
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mssql-pv
  namespace: mssql
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/mssql"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mssql-pvc
  namespace: mssql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
