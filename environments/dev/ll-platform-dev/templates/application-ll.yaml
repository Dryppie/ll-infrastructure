apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ll-app
  namespace: argocd
spec:
  destination:
    namespace: ll
    server: https://kubernetes.default.svc
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
  source:
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: 0.1.*
    chart: helm/ll-app
    helm:
      values: |
        #
        environmentHost: dev.legends-legacy.com
        liveOpsHost: {{ .Values.liveOps.host | quote }}

        ll-frontend:
          env:
            environment:
              value: "dev"
            allowAnonymous:
              value: "true"
            isLocal:
              value: "false"
            chatApiRoot:
              value: "chat"
            googleClientId:
              value: "431775673466-bq6f5ucno6j985rbstvf8b5aliqvo6h1.apps.googleusercontent.com"
            maintenanceEnabled:
              value: {{ .Values.maintenance.pageEnabled | quote }}
            maintenanceMessage:
              value: {{ .Values.maintenance.message | urlquery | quote }}
            maintenanceExpectedBack:
              value: {{ .Values.maintenance.expectedBack | urlquery | quote }}

        ll-backend:
          replicaCount: {{ ternary 0 .Values.workloads.backendReplicas .Values.maintenance.stopServices }}
          worker:
            enabled: true
            replicaCount: {{ ternary 0 .Values.workloads.workerReplicas .Values.maintenance.stopServices }}
          env:
            ASPNETCORE_ENVIRONMENT:
              value: Development

            Logging__Console__FormatterName:
              value: json

            Logging__Console__FormatterOptions__SingleLine:
              value: "true"

            Logging__Console__FormatterOptions__IncludeScopes:
              value: "true"

            Logging__Console__FormatterOptions__UseUtcTimestamp:
              value: "true"

            ConnectionStrings__LegendsLegacyDB:
              valueFrom:
                secretKeyRef:
                  name: postgres-ll-connection
                  key: connectionString

            Chat__SystemMessages__BaseUrl:
              value: {{ .Values.systemChat.baseUrl | quote }}

            Chat__SystemMessages__Secret:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.systemChat.secret.name | quote }}
                  key: {{ .Values.systemChat.secret.key | quote }}

            Google__ClientId:
              value: "431775673466-bq6f5ucno6j985rbstvf8b5aliqvo6h1.apps.googleusercontent.com"

            FeatureManagement__AllowAnonymous:
              value: "true"

            FeatureManagement__DisableAllRequests:
              value: {{ .Values.maintenance.rejectTraffic | quote }}

            FeatureManagement__MaintenanceMessage:
              value: {{ .Values.maintenance.message | quote }}

            FeatureManagement__MaintenanceRetryAfterSeconds:
              value: {{ .Values.maintenance.retryAfterSeconds | quote }}

        ll-chat:
          replicaCount: {{ ternary 0 .Values.workloads.chatReplicas .Values.maintenance.stopServices }}
          env:
            ASPNETCORE_ENVIRONMENT:
              value: Development

            Logging__Console__FormatterName:
              value: json

            Logging__Console__FormatterOptions__SingleLine:
              value: "true"

            Logging__Console__FormatterOptions__IncludeScopes:
              value: "true"

            Logging__Console__FormatterOptions__UseUtcTimestamp:
              value: "true"

            ConnectionStrings__LLChatDB:
              valueFrom:
                secretKeyRef:
                  name: postgres-chat-connection
                  key: connectionString

            SystemMessages__Secret:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.systemChat.secret.name | quote }}
                  key: {{ .Values.systemChat.secret.key | quote }}

            {{ if .Values.liveOps.enabled }}
            InternalModeration__Secret:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.liveOps.secretName | quote }}
                  key: chat-moderation-secret
            {{ end }}

            FeatureManagement__DisableAllRequests:
              value: {{ .Values.maintenance.rejectTraffic | quote }}

            FeatureManagement__MaintenanceMessage:
              value: {{ .Values.maintenance.message | quote }}

            FeatureManagement__MaintenanceRetryAfterSeconds:
              value: {{ .Values.maintenance.retryAfterSeconds | quote }}

        ll-liveops:
          enabled: {{ .Values.liveOps.enabled }}
          replicaCount: {{ ternary 0 .Values.workloads.liveOpsReplicas .Values.maintenance.stopServices }}
          probes:
            host: {{ .Values.liveOps.host | quote }}
          env:
            ASPNETCORE_ENVIRONMENT:
              value: Production

            AllowedHosts:
              value: {{ .Values.liveOps.host | quote }}

            ConnectionStrings__LegendsLegacyDB:
              valueFrom:
                secretKeyRef:
                  name: postgres-ll-connection
                  key: connectionString

            StaffIdentity__Authority:
              value: https://accounts.google.com

            StaffIdentity__Audience:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.liveOps.secretName | quote }}
                  key: google-client-id

            StaffIdentity__ClientId:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.liveOps.secretName | quote }}
                  key: google-client-id

            StaffIdentity__ClientSecret:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.liveOps.secretName | quote }}
                  key: google-client-secret

            StaffIdentity__CallbackPath:
              value: /signin-oidc

            StaffIdentity__OwnerSubject:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.liveOps.secretName | quote }}
                  key: owner-subject
                  optional: true

            StaffIdentity__BootstrapOwnerEmail:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.liveOps.secretName | quote }}
                  key: bootstrap-owner-email
                  optional: true

            ReverseProxy__Enabled:
              value: "true"

            ReverseProxy__ForwardLimit:
              value: "1"

            {{ range $index, $network := .Values.liveOps.trustedProxyNetworks }}
            ReverseProxy__KnownNetworks__{{ $index }}:
              value: {{ $network | quote }}
            {{ end }}

            Chat__Moderation__BaseUrl:
              value: {{ .Values.liveOps.chatBaseUrl | quote }}

            Chat__Moderation__Secret:
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.liveOps.secretName | quote }}
                  key: chat-moderation-secret
