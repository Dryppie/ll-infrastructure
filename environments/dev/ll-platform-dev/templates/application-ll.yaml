apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ads-app
  namespace: argocd
spec:
  destination:
    namespace: ads
    server: https://kubernetes.default.svc
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: false
  source:
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: 0.0.*
    chart: helm/ads-app
    helm:
      values: |
        #
        environmentHost: dev-legends-legacy.com

        ll-frontend:
          env:
            environment:
              value: "dev"
            allowAnonymous:
              value: "true"

        ll-backend:
          env:
            ASPNETCORE_ENVIRONMENT:
              value: Development

            # OIDC__Authority:
            #   value: ""

            # OIDC__Audience:
            #   value: "account"

            FeatureManagement__AllowAnonymous:
              value: "true"
