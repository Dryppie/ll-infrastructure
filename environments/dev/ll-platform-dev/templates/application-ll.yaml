apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ll-app
  namespace: argocd
spec:
  destination:
    namespace: ll
    server: https://kubernetes.default.svc
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
  source:
    repoURL: {{ .Values.argocd.repoURL }}
    targetRevision: 0.0.*
    chart: helm/ll-app
    helm:
      values: |
        #
        environmentHost: dev.legends-legacy.com

        ll-frontend:
          env:
            environment:
              value: "dev"
            allowAnonymous:
              value: "true"
            apiUrl:
              value: "http://ll-app-ll-backend.ll.svc.cluster.local:80"

        ll-backend:
          env:
            ASPNETCORE_ENVIRONMENT:
              value: Development

            Database__Type:
              value: "MariaDb"
            Database__ConnectionStrings__LegendsLegacyDB:
              valueFrom:
                secretKeyRef:
                  name: mariadb-ll-connection
                  key: connectionString

            FeatureManagement__AllowAnonymous:
              value: "false"
