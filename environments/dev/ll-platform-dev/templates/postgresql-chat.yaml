apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-chat-data
  namespace: ll
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi # resize later if needed
  storageClassName: "" # default StorageClass

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-chat-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/postgres-chat  # Make sure this directory exists on your node(s)
  persistentVolumeReclaimPolicy: Retain

---

apiVersion: v1
kind: Secret
metadata:
  name: postgres-chat-credentials
  namespace: ll
type: Opaque
stringData:
  POSTGRES_USER: chatuser
  POSTGRES_PASSWORD: Ch@tSecret!
  POSTGRES_DB: llchat

---

apiVersion: v1
kind: Secret
metadata:
  name: postgres-chat-ll-connection
  namespace: ll
type: Opaque
stringData:
  connectionString: "Host=postgres-chat;Port=5432;Username=chatuser;Password=Ch@tSecret!;Database=llchat"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-chat
  namespace: ll
spec:
  selector:
    matchLabels:
      app: postgres-chat
  replicas: 1 # bump for read-only scale-out (+replication)
  template:
    metadata:
      labels:
        app: postgres-chat
    spec:
      containers:
        - name: postgres-chat
          image: postgres:15
          imagePullPolicy: IfNotPresent

          # Environment comes straight from the Secret
          envFrom:
            - secretRef:
                name: postgres-chat-credentials

          ports:
            - containerPort: 5432
              name: postgres-chat

          # Basic health checks
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "devuser"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "devuser"]
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-chat-data

---

apiVersion: v1
kind: Service
metadata:
  name: postgres-chat
  namespace: ll
spec:
  selector:
    app: postgres-chat
  ports:
    - name: postgres-chat
      port: 5432
      targetPort: 5432
  type: ClusterIP