argocd:
  repoURL: ghcr.io/dryppie

maintenance:
  pageEnabled: false
  rejectTraffic: false
  stopServices: false
  message: "Legend's Legacy is undergoing maintenance."
  expectedBack: ""
  retryAfterSeconds: 300

workloads:
  backendReplicas: 1
  chatReplicas: 1
  liveOpsReplicas: 1
  workerReplicas: 1

liveOps:
  # Keep disabled until the ll-liveops SealedSecret and external hostname route exist.
  enabled: true
  host: liveops.legends-legacy.com
  chatBaseUrl: http://ll-app-ll-chat/chat/
  secretName: ll-liveops
  trustedProxyNetworks:
    # k3s default pod CIDR; verify against the cluster before enabling.
    - 10.42.0.0/16

systemChat:
  baseUrl: http://ll-app-ll-chat/chat
  secret:
    name: ll-system-chat
    key: secret

databaseReset:
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  gameDatabase: legendslegacy
  chatDatabase: myseconddb

observability:
  # Loki is intentionally opt-in. Enable the Argo CD Application only after the
  # R2 bucket, bucket-scoped token, SealedSecret, and default StorageClass have
  # been verified using OBSERVABILITY.md.
  enabled: true
  namespace: observability
  loki:
    chartVersion: "18.9.0"
    # Stage the Application at zero first, then raise this to one after the
    # prerequisite checks. Setting it back to zero is the non-destructive stop.
    replicas: 1
    secretName: loki-r2
    persistenceSize: 10Gi
    # k3s local-path is node-local, WaitForFirstConsumer, non-expandable, and
    # Delete-reclaim. R2 remains the durable retained-log store.
    storageClass: local-path
  alloy:
    enabled: true
    chartVersion: "1.11.1"
    clusterName: legends-legacy-dev
    environment: development
